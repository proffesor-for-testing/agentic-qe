name: qe-release
description: "End-to-end npm release workflow with verification gates and hardcoded-version protection"
minModelTier: tier1-any
tags: ["qe", "quality-engineering", "release-management"]
steps:
  - name: architecture
    description: "This project uses a **flat single-package structure** (post v3.7.4 flatten):"
    tools: ["bash", "read", "mcp:agentic-qe:*"]
    prompt: |
      This project uses a **flat single-package structure** (post v3.7.4 flatten):
  - name: arguments
    description: "- `<version>` — Target version (e.g., `3.7.5`). If omitted, prompt the user."
    tools: ["bash", "read"]
    prompt: |
      - `<version>` — Target version (e.g., `3.7.5`). If omitted, prompt the user.
  - name: steps
    description: "Steps"
    tools: ["bash", "read"]
    prompt: |
      Steps
  - name: 1-pre-flight-ensure-clean-state
    description: "1. Pre-Flight: Ensure Clean State"
    tools: ["bash", "read", "edit"]
    prompt: |
      1. Pre-Flight: Ensure Clean State
  - name: 2-version-audit
    description: "Read the current version from `package.json` (source of truth). Then grep the ENTIRE codebase for hardcoded version strings — current version, old versions, and any version-like patterns."
    tools: ["bash", "read", "edit", "grep"]
    prompt: |
      Read the current version from `package.json` (source of truth). Then grep the ENTIRE codebase for hardcoded version strings — current version, old versions, and any version-like patterns.
  - name: 3-bump-version
    description: "Update package.json to the target version:"
    tools: ["bash", "read", "edit", "grep", "mcp:agentic-qe:*"]
    prompt: |
      Update package.json to the target version:
  - name: 4-update-changelog
    description: "Add a new section to `CHANGELOG.md` (at root) following Keep a Changelog format:"
    tools: ["bash", "read", "edit"]
    prompt: |
      Add a new section to `CHANGELOG.md` (at root) following Keep a Changelog format:
  - name: version---yyyy-mm-dd
    description: "[<version>] - YYYY-MM-DD"
    tools: ["bash", "read"]
    prompt: |
      [<version>] - YYYY-MM-DD
