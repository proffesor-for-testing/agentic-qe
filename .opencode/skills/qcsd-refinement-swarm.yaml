name: qcsd-refinement-swarm
description: "Use when running Sprint Refinement sessions with SFDIPOT product factors, generating BDD scenarios, or validating requirements in the QCSD Refinement phase."
minModelTier: tier3-best
tags: ["qcsd", "refinement", "sfdipot", "bdd", "gherkin", "requirements", "swarm", "parallel", "ddd", "qe", "quality-engineering", "qcsd-phases"]
steps:
  - name: overview
    description: "The Refinement Swarm takes user stories that passed Ideation and prepares them for Sprint commitment using SFDIPOT product factors, BDD scenarios, and INVEST validation. It renders a READY / CONDITIONAL / NOT-READY decision."
    tools: ["bash", "read"]
    prompt: |
      The Refinement Swarm takes user stories that passed Ideation and prepares them for Sprint commitment using SFDIPOT product factors, BDD scenarios, and INVEST validation. It renders a READY / CONDITIONAL / NOT-READY decision.
  - name: qcsd-phase-positioning
    description: "QCSD Phase Positioning"
    tools: ["bash", "read"]
    prompt: |
      QCSD Phase Positioning
  - name: parameters
    description: "- `STORY_CONTENT`: User story with acceptance criteria (required) - `OUTPUT_FOLDER`: Where to save reports (default: `${PROJECT_ROOT}/Agentic QCSD/refinement/`)"
    tools: ["bash", "read"]
    prompt: |
      - `STORY_CONTENT`: User story with acceptance criteria (required) - `OUTPUT_FOLDER`: Where to save reports (default: `${PROJECT_ROOT}/Agentic QCSD/refinement/`)
  - name: enforcement-rules---read-first
    description: "ENFORCEMENT RULES - READ FIRST"
    tools: ["bash", "read"]
    prompt: |
      ENFORCEMENT RULES - READ FIRST
  - name: step-execution-protocol
    description: "Execute steps sequentially by reading each step file with the Read tool."
    tools: ["bash", "read"]
    prompt: |
      Execute steps sequentially by reading each step file with the Read tool.
  - name: steps
    description: "1. **Flag Detection** -- `node_modules/agentic-qe/assets/skills/qcsd-refinement-swarm/steps/01-flag-detection.md` -- Analyze story content, evaluate all 7 flags 2. **Core Agents** -- `node_modules/agentic-qe/assets/skills/qcsd-refinement-swarm/steps/02-core-agents.md` -- Spawn qe-product-factors-assessor, qe-bdd-generator, qe-requirements-validator 3. **Batch 1 Results** -- `node_modules/agentic-qe/assets/skills/qcsd-refinement-swarm/steps/03-batch1-results.md` -- Wait and ex"
    tools: ["bash", "read", "grep", "mcp:agentic-qe:*"]
    prompt: |
      1. **Flag Detection** -- `node_modules/agentic-qe/assets/skills/qcsd-refinement-swarm/steps/01-flag-detection.md` -- Analyze story content, evaluate all 7 flags 2. **Core Agents** -- `node_modules/agentic-qe/assets/skills/qcsd-refinement-swarm/steps/02-core-agents.md` -- Spawn qe-product-factors-assessor, qe-bdd-generator, qe-requirements-validator 3. **Batch 1 Results** -- `node_modules/agentic-qe/assets/skills/qcsd-refinement-swarm/steps/03-batch1-results.md` -- Wait and ex
  - name: execution-instructions
    description: "1. Use the Read tool to load the current step file 2. Execute the step's instructions completely 3. Verify all success criteria are met 4. Pass output as context to next step 5. If a step fails, halt and report"
    tools: ["bash", "read"]
    prompt: |
      1. Use the Read tool to load the current step file 2. Execute the step's instructions completely 3. Verify all success criteria are met 4. Pass output as context to next step 5. If a step fails, halt and report
  - name: resume-support
    description: "To resume from a specific step: specify `--from-step N`."
    tools: ["bash", "read"]
    prompt: |
      To resume from a specific step: specify `--from-step N`.
