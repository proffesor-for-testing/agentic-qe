name: qe-testability-scoring
description: "AI-powered testability assessment using 10 principles of intrinsic testability with Playwright and optional Vibium integration. Evaluates web applications against Observability, Controllability, Algorithmic Simplicity, Transparency, Stability, Explainability, Unbugginess, Smallness, Decomposability,"
minModelTier: tier3-best
tags: ["testability", "scoring", "playwright", "vibium", "assessment", "10-principles", "intrinsic-testability", "james-bach", "michael-bolton", "qe", "quality-engineering", "testing-methodologies"]
steps:
  - name: browser-engine
    description: "Uses the **qe-browser** fleet skill (`.claude/skills/qe-browser/`) as the primary browser engine. Vibium is installed by `aqe init`. The legacy `node_modules/agentic-qe/assets/skills/testability-scoring/scripts/run-assessment.sh` + Playwright path remains as a fallback when a team already has a Playwright test suite configured, but new runs should prefer:"
    tools: ["bash", "read"]
    prompt: |
      Uses the **qe-browser** fleet skill (`.claude/skills/qe-browser/`) as the primary browser engine. Vibium is installed by `aqe init`. The legacy `node_modules/agentic-qe/assets/skills/testability-scoring/scripts/run-assessment.sh` + Playwright path remains as a fallback when a team already has a Playwright test suite configured, but new runs should prefer:
  - name: running-assessments
    description: "Running Assessments"
    tools: ["bash", "read"]
    prompt: |
      Running Assessments
  - name: principle-details
    description: "Principle Details"
    tools: ["bash", "read", "edit"]
    prompt: |
      Principle Details
  - name: assessment-workflow
    description: "Assessment Workflow"
    tools: ["bash", "read"]
    prompt: |
      Assessment Workflow
  - name: output-files
    description: "Output Files"
    tools: ["bash", "read"]
    prompt: |
      Output Files
  - name: integration-examples
    description: "Integration Examples"
    tools: ["bash", "read"]
    prompt: |
      Integration Examples
  - name: cicd-integration
    description: "CI/CD Integration"
    tools: ["bash", "read"]
    prompt: |
      CI/CD Integration
  - name: qx-partner-integration
    description: "QX Partner Integration"
    tools: ["bash", "read"]
    prompt: |
      QX Partner Integration
