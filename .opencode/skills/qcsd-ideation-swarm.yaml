name: qcsd-ideation-swarm
description: "Use when running Quality Criteria sessions during PI/Sprint planning with HTSM v6.3, Risk Storming, or Testability analysis in the QCSD Ideation phase."
minModelTier: tier3-best
tags: ["qcsd", "ideation", "htsm", "quality-criteria", "risk-storming", "testability", "swarm", "parallel", "ddd", "qe", "quality-engineering", "qcsd-phases"]
steps:
  - name: overview
    description: "The Ideation Swarm assesses stories and URLs before development begins, using HTSM v6.3 quality criteria, Risk Storming, and Testability analysis. It renders a GO / CONDITIONAL / NO-GO decision and is the first gate in the QCSD lifecycle."
    tools: ["bash", "read"]
    prompt: |
      The Ideation Swarm assesses stories and URLs before development begins, using HTSM v6.3 quality criteria, Risk Storming, and Testability analysis. It renders a GO / CONDITIONAL / NO-GO decision and is the first gate in the QCSD lifecycle.
  - name: qcsd-phase-positioning
    description: "QCSD Phase Positioning"
    tools: ["bash", "read"]
    prompt: |
      QCSD Phase Positioning
  - name: parameters
    description: "- `URL`: Website to analyze (required for URL mode) - `OUTPUT_FOLDER`: Where to save reports (default: `${PROJECT_ROOT}/Agentic QCSD/{domain}/`) - URL fetch: run `node_modules/agentic-qe/scripts/fetch-content.cjs`; on `status: degraded` or a missing script, use WebFetch"
    tools: ["bash", "read", "mcp:agentic-qe:*"]
    prompt: |
      - `URL`: Website to analyze (required for URL mode) - `OUTPUT_FOLDER`: Where to save reports (default: `${PROJECT_ROOT}/Agentic QCSD/{domain}/`) - URL fetch: run `node_modules/agentic-qe/scripts/fetch-content.cjs`; on `status: degraded` or a missing script, use WebFetch
  - name: unique-features
    description: "- **URL Mode**: Automated 5-tier browser cascade for live website analysis - **HAS_VIDEO Flag**: Detects video content and recommends `/a11y-ally` follow-up - **HTML Output**: Generates HTML reports when `html_output: true` - **Browser Cascade**: Vibium -> agent-browser -> Playwright+Stealth -> WebF"
    tools: ["bash", "read", "grep"]
    prompt: |
      - **URL Mode**: Automated 5-tier browser cascade for live website analysis - **HAS_VIDEO Flag**: Detects video content and recommends `/a11y-ally` follow-up - **HTML Output**: Generates HTML reports when `html_output: true` - **Browser Cascade**: Vibium -> agent-browser -> Playwright+Stealth -> WebF
  - name: enforcement-rules---read-first
    description: "ENFORCEMENT RULES - READ FIRST"
    tools: ["bash", "read"]
    prompt: |
      ENFORCEMENT RULES - READ FIRST
  - name: step-execution-protocol
    description: "This skill uses a micro-file step architecture. Each step is a self-contained file loaded one at a time to avoid \"lost in the middle\" context degradation."
    tools: ["bash", "read"]
    prompt: |
      This skill uses a micro-file step architecture. Each step is a self-contained file loaded one at a time to avoid "lost in the middle" context degradation.
  - name: steps
    description: "1. **Flag Detection** -- `node_modules/agentic-qe/assets/skills/qcsd-ideation-swarm/steps/01-flag-detection.md` -- Fetch URL content (browser cascade), detect all 7 flags (HAS_UI, HAS_SECURITY, HAS_UX, HAS_VIDEO, HAS_MIDDLEWARE, HAS_SAP_INTEGRATION, HAS_AUTHORIZATION) 2. **Core Agents** -- `node_modules/agentic-qe/assets/skills/qcsd-ideation-swarm/steps/02-core-agents.md` -- Spawn qe-quality-criteria-recommender,"
    tools: ["bash", "read", "grep", "mcp:agentic-qe:*"]
    prompt: |
      1. **Flag Detection** -- `node_modules/agentic-qe/assets/skills/qcsd-ideation-swarm/steps/01-flag-detection.md` -- Fetch URL content (browser cascade), detect all 7 flags (HAS_UI, HAS_SECURITY, HAS_UX, HAS_VIDEO, HAS_MIDDLEWARE, HAS_SAP_INTEGRATION, HAS_AUTHORIZATION) 2. **Core Agents** -- `node_modules/agentic-qe/assets/skills/qcsd-ideation-swarm/steps/02-core-agents.md` -- Spawn qe-quality-criteria-recommender,
