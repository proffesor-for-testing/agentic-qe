  - name: primary-path-qe-browser-visual-diff
    description: "**Most visual regression work should go through the `qe-browser` fleet skill.** It wraps Vibium (WebDriver BiDi) and provides pixel-diff against stored baselines with threshold enforcement and diff-image output. See `.claude/skills/qe-browser/SKILL.md`."
    tools: ["bash", "read", "edit"]
    prompt: |
      **Most visual regression work should go through the `qe-browser` fleet skill.** It wraps Vibium (WebDriver BiDi) and provides pixel-diff against stored baselines with threshold enforcement and diff-image output. See `.claude/skills/qe-browser/SKILL.md`.
  - name: when-to-keep-playwright-visual-regressio
    description: "Use the Playwright recipe below only when you need: - **AI semantic comparison** (Percy, Applitools) to ignore insignificant pixel drift - **Cross-browser rendering checks** in Firefox/WebKit (Vibium is Chrome-only today) - **Tight integration with an existing Playwright test suite**"
