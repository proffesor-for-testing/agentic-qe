    tools: ["bash", "read"]
    prompt: |
      - **Test failing?** → Use `/test-failure-investigator` to diagnose root cause - **File a bug** → Use `/bug-reporting-excellence` for proper bug reporting - **Test selection** → Use `/risk-based-testing` for risk-based prioritization
  - name: gotchas
    description: "- Agent defaults to \"run everything\" despite being told to select — explicitly constrain with `--affected` or file list - Change-based selection misses transitive dependencies — a model change can break a controller test 3 hops away - Flaky tests in regression suites erode trust faster than missing "
    tools: ["bash", "read", "edit"]
    prompt: |
      - Agent defaults to "run everything" despite being told to select — explicitly constrain with `--affected` or file list - Change-based selection misses transitive dependencies — a model change can break a controller test 3 hops away - Flaky tests in regression suites erode trust faster than missing 
