name: qe-verification-quality
description: "Verify agent-written changes before they are kept: run the tests, measure coverage, scan for vulnerabilities, apply AQE's fail-closed quality gate, and revert with git when the verdict is a failure. Use when an agent's output needs a measured pass/fail decision rather than a self-reported one."
minModelTier: tier2-good
tags: ["qe", "quality-engineering"]
steps:
  - name: what-this-skill-does
    description: "This skill turns \"the agent says it works\" into a measured verdict:"
    tools: ["bash", "read", "edit"]
    prompt: |
      This skill turns "the agent says it works" into a measured verdict:
  - name: the-quality-gate
    description: "`aqe quality --gate` evaluates the measured evidence and reports a verdict with one of four exit codes:"
    tools: ["bash", "read", "edit", "grep", "mcp:agentic-qe:*"]
    prompt: |
      `aqe quality --gate` evaluates the measured evidence and reports a verdict with one of four exit codes:
  - name: pinned-checklist-verdicts
    description: "For a two-gate, three-valued verdict on one artifact against a frozen checklist (the anchor ships with agentic-qe, so this works in any project from the release after 3.15.22; #1454):"
    tools: ["bash", "read", "mcp:agentic-qe:*"]
    prompt: |
      For a two-gate, three-valued verdict on one artifact against a frozen checklist (the anchor ships with agentic-qe, so this works in any project from the release after 3.15.22; #1454):
  - name: verification-checks
    description: "Verification Checks"
    tools: ["bash", "read"]
    prompt: |
      Verification Checks
  - name: tests
    description: "Tests"
    tools: ["bash", "read"]
    prompt: |
      Tests
  - name: coverage
    description: "Coverage"
    tools: ["bash", "read"]
    prompt: |
      Coverage
  - name: security
    description: "Security"
    tools: ["bash", "read"]
    prompt: |
      Security
  - name: audit-trail
    description: "Audit trail"
    tools: ["bash", "read"]
    prompt: |
      Audit trail
