<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">Frame risk, do the work, challenge results, decide and learn. Conceptual workflow with human review.</title><desc id="desc">Original Agentic QE visual in dark teal and cyan. Frame risk, do the work, challenge results, decide and learn. Conceptual workflow with human review.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071a20"/><stop offset="1" stop-color="#10343b"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#61cbc9" stroke-opacity=".07"/></pattern></defs><rect width="1200" height="510" rx="22" fill="url(#bg)"/><rect width="1200" height="510" rx="22" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif" fill="#e6f4f4"><text x="40" y="44" font-size="18" fill="#78ddd3" letter-spacing="2">A QUALITY FEEDBACK LOOP</text><text x="40" y="82" font-size="28" fill="#e6f4f4" >A recommendation earns trust through checks and review.</text><rect x="40" y="122" width="250" height="182" rx="14" fill="#0a252d" stroke="#31717a"/><text x="59" y="155" font-size="15" fill="#78ddd3" >01</text><text x="59" y="192" font-size="23" fill="#e6f4f4" font-weight="700">Frame the risk</text><text x="59" y="234" font-size="18" fill="#e6f4f4" >Change + context</text><text x="59" y="269" font-size="18" fill="#bed8dc" >What could fail?</text><rect x="330" y="122" width="250" height="182" rx="14" fill="#0a252d" stroke="#31717a"/><text x="349" y="155" font-size="15" fill="#78ddd3" >02</text><text x="349" y="192" font-size="23" fill="#e6f4f4" font-weight="700">Do the work</text><text x="349" y="234" font-size="18" fill="#e6f4f4" >Generate + execute</text><text x="349" y="269" font-size="18" fill="#bed8dc" >Keep run evidence</text><rect x="620" y="122" width="250" height="182" rx="14" fill="#0a252d" stroke="#31717a"/><text x="639" y="155" font-size="15" fill="#78ddd3" >03</text><text x="639" y="192" font-size="23" fill="#e6f4f4" font-weight="700">Challenge it</text><text x="639" y="234" font-size="18" fill="#e6f4f4" >Coverage + mutation</text><text x="639" y="269" font-size="18" fill="#bed8dc" >Security + review</text><rect x="910" y="122" width="250" height="182" rx="14" fill="#0a252d" stroke="#31717a"/><text x="929" y="155" font-size="15" fill="#78ddd3" >04</text><text x="929" y="192" font-size="23" fill="#e6f4f4" font-weight="700">Decide + learn</text><text x="929" y="234" font-size="18" fill="#e6f4f4" >Human quality decision</text><text x="929" y="269" font-size="18" fill="#bed8dc" >Record the outcome</text><path d="M290 211H322M580 211H612M870 211H902M1035 321V358H165V321" fill="none" stroke="#78ddd3" stroke-width="3"/><text x="455" y="388" font-size="16" fill="#78ddd3" letter-spacing="2">OUTCOME FEEDBACK → REUSABLE PATTERNS</text><text x="40" y="441" font-size="21" fill="#e6f4f4" >Truth filter: inspect claims, surface uncertainty, keep people accountable.</text><text x="40" y="479" font-size="17" fill="#bed8dc" >Conceptual workflow. Available checks depend on your task, tools and configuration.</text></g></svg>